auth = "plain[passwd=/tmp/netos-oc-test/passwd]"
listen-host = 127.0.0.1
tcp-port = 4443
udp-port = 4443
run-as-user = ocserv
run-as-group = ocserv
socket-file = /tmp/netos-oc-test/socket
server-cert = /etc/ssl/certs/ssl-cert-snakeoil.pem
server-key = /etc/ssl/private/ssl-cert-snakeoil.key
isolate-workers = false
max-clients = 2
max-same-clients = 2
keepalive = 30
dpd = 20
mobile-dpd = 20
auth-timeout = 30
cookie-timeout = 120
pid-file = /tmp/netos-oc-test/ocserv.pid
device = vpns-test
predictable-ips = true
ipv4-network = 10.250.0.0
ipv4-netmask = 255.255.255.0
ping-leases = false
log-level = 2
cisco-client-compat = true
