// Wire-compatible subset of Xray v26.7.28 StatsService messages:
// https://github.com/XTLS/Xray-core/blob/v26.7.28/app/stats/command/command.proto
// Regenerate with protoc-gen-go v1.36.11 and --go_opt=paths=source_relative.
syntax = "proto3";
package xray.app.stats.command;
option go_package = "github.com/netos-router/netos/internal/system/xraystats";

message OnlineIPEntry {
  string ip = 1;
  int64 last_seen = 2;
}
message TrafficUserStat {
  int64 uplink = 1;
  int64 downlink = 2;
}
message UserStat {
  string email = 1;
  repeated OnlineIPEntry ips = 2;
  TrafficUserStat traffic = 3;
}
message GetUsersStatsRequest {
  bool include_traffic = 1;
  bool reset = 2;
}
message GetUsersStatsResponse {
  repeated UserStat users = 1;
}
