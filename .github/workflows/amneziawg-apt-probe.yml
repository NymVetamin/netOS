name: amneziawg-apt-probe

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  repository:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        debian: [bookworm, trixie]
    steps:
      - name: Inspect official packages in a disposable Debian container
        env:
          DEBIAN: ${{ matrix.debian }}
        run: |
          docker run --rm -i "debian:$DEBIAN" bash -s <<'SCRIPT'
          set -euo pipefail
          apt-get update -qq
          apt-get install -y --no-install-recommends ca-certificates curl gnupg
          curl --fail --location --connect-timeout 15 --max-time 60 \
            'https://keyserver.ubuntu.com/pks/lookup?op=get&search=0x75C9DD72C799870E310542E24166F2C257290828' -o /tmp/amnezia.asc
          fingerprint=$(gpg --show-keys --with-colons /tmp/amnezia.asc | awk -F: '$1=="fpr" { print $10; exit }')
          test "$fingerprint" = 75C9DD72C799870E310542E24166F2C257290828
          gpg --dearmor --output /usr/share/keyrings/netos-amnezia.gpg /tmp/amnezia.asc
          echo 'deb [signed-by=/usr/share/keyrings/netos-amnezia.gpg] https://ppa.launchpadcontent.net/amnezia/ppa/ubuntu focal main' > /etc/apt/sources.list.d/netos-amnezia.list
          apt-get -o APT::Update::Error-Mode=any update
          apt-cache policy amneziawg amneziawg-dkms amneziawg-tools
          apt-cache show amneziawg amneziawg-dkms amneziawg-tools
          mkdir /tmp/packages
          cd /tmp/packages
          apt-get download amneziawg amneziawg-dkms amneziawg-tools
          for deb in *.deb; do
            dpkg-deb -I "$deb"
            dpkg-deb -x "$deb" /tmp/inspect
          done
          /tmp/inspect/usr/bin/awg --version
          find /tmp/inspect/usr/src -maxdepth 3 -type f -name version.h -exec cat {} \;
          grep -R -n -E 'HeaderProtectionKey|ContentPaddingAddition|RandomTrailers|DisableCookies' /tmp/inspect/usr/src || true
          SCRIPT
