name: amneziawg-apt-probe

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native-kernel-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: amnezia-vpn/amneziawg-tools
          ref: ee0f0a9aa34ff0a0da4b3433b9512781cfe02843
          path: native-tools
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: amnezia-vpn/amneziawg-linux-kernel-module
          ref: 4569c4c67f3a57414969260cafbbd04694fbaae0
          path: native-kernel
          persist-credentials: false
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      # Research fixture only. No package is built or published for users.
      - name: Verify native kernel settings and reset in an empty namespace
        run: |
          test -d "/lib/modules/$(uname -r)/build"
          make -C native-tools/src -j2
          make -C native-kernel/src -j2
          (cd backend && go test -c -o "$RUNNER_TEMP/awg-kernel.test" ./internal/amneziawg)
          sudo modprobe -a udp_tunnel ip6_udp_tunnel
          sudo insmod native-kernel/src/amneziawg.ko
          trap 'sudo rmmod amneziawg' EXIT
          sudo unshare -n env NETOS_AWG_KERNEL_TEST=1 NETOS_AWG_TOOLS_BINARY="$GITHUB_WORKSPACE/native-tools/src/wg" \
            "$RUNNER_TEMP/awg-kernel.test" -test.run '^TestAmneziaWGNativeKernelContract$' -test.v -test.timeout 120s
  native-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: amnezia-vpn/amneziawg-tools
          ref: ee0f0a9aa34ff0a0da4b3433b9512781cfe02843
          path: native-tools
          persist-credentials: false
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      # This executable is a test fixture only, never a netOS component or
      # installation fallback. Official APT package checks remain independent.
      - name: Check generated profiles with the official native parser
        run: |
          make -C native-tools/src -j2
          cd backend
          go test -c -o "$RUNNER_TEMP/awg-contract.test" ./internal/amneziawg
          sudo unshare -n env NETOS_AWG_TOOLS_BINARY="$GITHUB_WORKSPACE/native-tools/src/wg" \
            "$RUNNER_TEMP/awg-contract.test" -test.run '^TestAmneziaWGNativeToolsContract$' -test.v -test.timeout 120s
      - name: Verify existing runtime traffic and signature reset
        run: |
          sudo unshare --net --mount env NETOS_INTEGRATION=1 \
            "$RUNNER_TEMP/awg-contract.test" -test.run '^TestIntegrationAmneziaWG$' -test.v -test.timeout 60s
  connectivity:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - name: Check official endpoints outside Docker
        run: |
          success=0
          for host in ppa.launchpadcontent.net ppa.launchpad.net; do
            for scheme in https http; do
              url="$scheme://$host/amnezia/ppa/ubuntu/dists/focal/InRelease"
              echo "Checking $url"
              if curl -4 --fail --location --connect-timeout 10 --max-time 15 \
                --output "$RUNNER_TEMP/amnezia-InRelease" "$url"; then
                head -20 "$RUNNER_TEMP/amnezia-InRelease"
                success=1
              fi
            done
          done
          test "$success" = 1
  repository:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        debian: [bookworm, trixie]
    steps:
      - name: Inspect official packages in a disposable Debian container
        env:
          DEBIAN: ${{ matrix.debian }}
        run: |
          docker run --rm -i "debian:$DEBIAN" bash -s <<'SCRIPT'
          set -euo pipefail
          apt-get update -qq
          apt-get install -y --no-install-recommends ca-certificates curl gnupg
          getent ahostsv4 keyserver.ubuntu.com ppa.launchpadcontent.net
          # Diagnostic only; APT below still verifies signed metadata.
          curl -4 --fail --location --connect-timeout 15 --max-time 60 \
            https://ppa.launchpadcontent.net/amnezia/ppa/ubuntu/dists/focal/Release -o /tmp/amnezia-Release
          head -30 /tmp/amnezia-Release
          curl -4 --fail --location --retry 2 --retry-all-errors --connect-timeout 15 --max-time 60 \
            'https://keyserver.ubuntu.com/pks/lookup?op=get&search=0x75C9DD72C799870E310542E24166F2C257290828' -o /tmp/amnezia.asc
          fingerprint=$(gpg --show-keys --with-colons /tmp/amnezia.asc | awk -F: '$1=="fpr" { print $10; exit }')
          test "$fingerprint" = 75C9DD72C799870E310542E24166F2C257290828
          gpg --dearmor --output /usr/share/keyrings/netos-amnezia.gpg /tmp/amnezia.asc
          echo 'deb [signed-by=/usr/share/keyrings/netos-amnezia.gpg] https://ppa.launchpadcontent.net/amnezia/ppa/ubuntu focal main' > /etc/apt/sources.list.d/netos-amnezia.list
          apt-get -o APT::Update::Error-Mode=any update
          apt-cache policy amneziawg amneziawg-dkms amneziawg-tools
          apt-cache show amneziawg amneziawg-dkms amneziawg-tools
          mkdir /tmp/packages
          cd /tmp/packages
          apt-get download amneziawg amneziawg-dkms amneziawg-tools
          for deb in *.deb; do
            dpkg-deb -I "$deb"
            dpkg-deb -x "$deb" /tmp/inspect
          done
          /tmp/inspect/usr/bin/awg --version
          find /tmp/inspect/usr/src -maxdepth 3 -type f -name version.h -exec cat {} \;
          grep -R -n -E 'HeaderProtectionKey|ContentPaddingAddition|RandomTrailers|DisableCookies' /tmp/inspect/usr/src || true
          SCRIPT
