name: release

on:
  push:
    tags: ["v*"]
  # Ручной запуск нужен, когда тег уже существует, а релиз пришлось пересобрать.
  workflow_dispatch:
    inputs:
      tag:
        description: "Тег для сборки, например v0.2.0"
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - name: проверить тег релиза
        run: |
          if [[ ! "$TAG" =~ ^[a-zA-Z0-9][a-zA-Z0-9._+-]*$ ]]; then
            echo "Недопустимое имя тега релиза" >&2
            exit 1
          fi

      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: refs/tags/${{ env.TAG }}

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      # Порядок обязателен: vite кладёт файлы в backend/internal/api/webdist,
      # откуда их забирает go:embed. Сборка бэкенда до фронтенда дала бы
      # бинарник с панелью от прошлого раза или вовсе без неё.
      - name: сборка фронтенда
        working-directory: web
        run: |
          npm ci
          npm run build

      # Релиз собирается из тега, а CI проверял ветку: без своего прогона
      # тестов тег, поставленный на непроверенный коммит, ушёл бы на роутеры.
      - name: тесты панели
        working-directory: web
        run: npm test

      - name: панель действительно попала в сборку
        run: |
          test -s backend/internal/api/webdist/app.js
          test -s backend/internal/api/webdist/index.html

      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      # Тесты бэкенда проверяют встроенную панель, поэтому идут после её сборки.
      - name: тесты бэкенда
        working-directory: backend
        run: |
          go vet ./...
          go test ./...

      # CGO выключен намеренно: sqlite взят в чистой реализации на Go, поэтому
      # бинарник получается статическим и не зависит от версии libc на машине,
      # куда его поставят.
      - name: сборка бинарников
        working-directory: backend
        env:
          CGO_ENABLED: "0"
          GOOS: linux
        run: |
          mkdir -p ../dist
          for arch in amd64 arm64; do
            GOARCH=$arch go build \
              -trimpath \
              -ldflags "-s -w -X main.version=$TAG" \
              -o "../dist/netosd-linux-$arch" ./cmd/netosd
          done

      # Имена файлов и формат суммы должны совпадать с тем, что ждёт
      # install.sh: он берёт netosd-linux-<arch> и рядом лежащий файл .sha256,
      # из которого читает первое поле.
      - name: контрольные суммы
        working-directory: dist
        run: |
          for f in netosd-linux-*; do
            sha256sum "$f" > "$f.sha256"
          done
          ls -l

      - name: проверка собранного
        working-directory: dist
        run: |
          chmod +x netosd-linux-amd64
          # Версия обязана совпасть с тегом: иначе netos update не поймёт,
          # что машина уже обновлена.
          got=$(./netosd-linux-amd64 -version)
          echo "$got"
          test "$got" = "netOS $TAG"
          # Суммы должны сходиться ровно так, как их будет считать установщик.
          sha256sum -c netosd-linux-amd64.sha256
          sha256sum -c netosd-linux-arm64.sha256

      - name: публикация релиза
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          notes="Установка и обновление:

          \`\`\`
          curl -fsSL https://raw.githubusercontent.com/$GITHUB_REPOSITORY/$TAG/install.sh | sudo env NETOS_VERSION=$TAG bash && source /etc/bash_completion.d/netos
          \`\`\`

          На уже установленной машине: \`sudo netos update\`."
          flags=()
          if [[ "$TAG" =~ ^v?[0-9]+(\.[0-9]+){1,3}-[a-zA-Z0-9-] ]]; then
            flags+=(--prerelease)
          fi
          if existing=$(gh release view "$TAG" --json isPrerelease --jq '.isPrerelease' 2>/dev/null); then
            if [[ ${#flags[@]} -gt 0 && "$existing" == false ]]; then
              gh release edit "$TAG" --prerelease
            fi
            gh release upload "$TAG" dist/* --clobber
          else
            gh release create "$TAG" dist/* --title "netOS $TAG" --notes "$notes" "${flags[@]}"
          fi
