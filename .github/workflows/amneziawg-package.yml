name: amneziawg-package

on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - 'backend/cmd/netos-amneziawg-go/**'
      - 'backend/internal/awgruntime/**'
      - 'backend/go.mod'
      - 'backend/go.sum'
      - 'scripts/build-amneziawg-package.sh'
      - '.github/workflows/amneziawg-package.yml'

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - name: Build and verify reproducible packages
        run: |
          bash scripts/build-amneziawg-package.sh "$RUNNER_TEMP/packages"
          bash scripts/build-amneziawg-package.sh "$RUNNER_TEMP/repeat"
          diff "$RUNNER_TEMP/packages/SHA256SUMS" "$RUNNER_TEMP/repeat/SHA256SUMS"
          for arch in amd64 arm64; do
            deb="$RUNNER_TEMP/packages/netos-amneziawg-go_3.1.20260828-1_$arch.deb"
            test "$(dpkg-deb -f "$deb" Architecture)" = "$arch"
            test -z "$(dpkg-deb -f "$deb" Depends)"
            dpkg-deb -x "$deb" "$RUNNER_TEMP/unpack-$arch"
            file "$RUNNER_TEMP/unpack-$arch/usr/lib/netos/amneziawg-go" | grep 'statically linked'
            test -s "$RUNNER_TEMP/unpack-$arch/usr/share/doc/netos-amneziawg-go/copyright"
          done
          test "$("$RUNNER_TEMP/unpack-amd64/usr/lib/netos/amneziawg-go" --version)" = 'netos-amneziawg-go 3.1.20260828-1'
          sudo apt-get install -y "$RUNNER_TEMP/packages/netos-amneziawg-go_3.1.20260828-1_amd64.deb"
          /usr/lib/netos/amneziawg-go --version
          sudo apt-get purge -y netos-amneziawg-go
          test ! -e /usr/lib/netos/amneziawg-go
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: amneziawg-deb
          path: ${{ runner.temp }}/packages/*
