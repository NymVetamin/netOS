name: ci

on:
  push:
    branches: [master, qa/ci-webdist-fce19fa]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    needs: frontend
    if: ${{ !cancelled() && needs.frontend.outputs.webdist != '' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          # Версия берётся из go.mod, чтобы не разъезжаться с ней при обновлении.
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: webdist
          path: backend/internal/api/webdist

      - name: go vet
        working-directory: backend
        run: go vet ./...

      - name: go test
        working-directory: backend
        run: go test ./...

      - name: diagnostic tools on Linux loopback
        working-directory: backend
        run: |
          sudo apt-get update -qq
          sudo env DEBIAN_FRONTEND=noninteractive apt-get install -y iputils-ping traceroute mtr-tiny bind9-dnsutils tcpdump iperf3 iproute2 conntrack iptables
          go test -c -o /tmp/netos-diagnostic.test ./internal/api
          sudo env NETOS_DIAGNOSTIC_LINUX_TEST=1 /tmp/netos-diagnostic.test -test.run '^TestDiagnosticLinux' -test.v -test.timeout 90s

      # Кросс-сборка под обе архитектуры релиза: пусть несобираемость под arm64
      # выясняется здесь, а не в момент выпуска версии.
      - name: сборка под все архитектуры
        working-directory: backend
        env:
          CGO_ENABLED: "0"
          GOOS: linux
        run: |
          for arch in amd64 arm64; do
            GOARCH=$arch go build -trimpath -o /dev/null ./cmd/netosd
          done

  # Готовый бинарник каждой сборки. Нужен, чтобы доставлять изменения на стенд,
  # не выпуская релиз: scripts/dev-push.sh забирает артефакт через
  # gh run download, когда локального Go нет. Собирается ровно так же, как
  # релизный, — с фронтендом внутри и без CGO.
  binary:
    needs: frontend
    if: ${{ !cancelled() && needs.frontend.outputs.webdist != '' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: webdist
          path: backend/internal/api/webdist

      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - name: сборка бинарников
        working-directory: backend
        env:
          CGO_ENABLED: "0"
          GOOS: linux
        run: |
          mkdir -p ../dist
          for arch in amd64 arm64; do
            GOARCH=$arch go build \
              -trimpath \
              -ldflags "-X main.version=dev-${GITHUB_SHA::7}" \
              -o "../dist/netosd-linux-$arch" ./cmd/netosd
          done

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: netosd-linux-amd64
          path: dist/netosd-linux-amd64
          retention-days: 7

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: netosd-linux-arm64
          path: dist/netosd-linux-arm64
          retention-days: 7

  frontend:
    runs-on: ubuntu-latest
    outputs:
      webdist: ${{ steps.webdist.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: установка зависимостей
        working-directory: web
        run: npm ci

      # npm run build сам начинается с tsc --noEmit, так что проверка типов
      # и сборка происходят одной командой.
      - name: сборка
        working-directory: web
        run: npm run build

      - name: увеличить тестовый набор в восемь раз
        working-directory: backend/internal/api/webdist
        run: |
          for n in {1..7}; do
            mkdir "sample-$n"
            cp -t "sample-$n" -- *.woff *.woff2 *.js *.css *.html
          done

      - id: webdist
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: webdist
          path: backend/internal/api/webdist
          if-no-files-found: error
          retention-days: 1

      - name: тесты панели
        working-directory: web
        run: npm test && exit 42

      # Сборка фронтенда кладёт файлы в backend/internal/api/webdist. Если она
      # оставила репозиторий грязным сверх ожидаемого, значит что-то пишется не
      # туда, куда думает .gitignore.
      - name: репозиторий не загрязнён сборкой
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "сборка изменила отслеживаемые файлы:"
            git status --porcelain
            exit 1
          fi

  installer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      # Установщик запускается под root на чужой машине: синтаксическая ошибка
      # в нём дороже любой другой.
      - name: проверка install.sh
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck
          bash -n install.sh
          bash -n scripts/dev-push.sh
          bash scripts/tests/dev-push-restore.sh
          bash scripts/tests/dev-push-concurrent.sh
          bash scripts/tests/dev-push-revision.sh
          bash scripts/tests/installer-restore.sh
          bash scripts/tests/installer-source.sh
          shellcheck --severity=warning install.sh scripts/dev-push.sh
