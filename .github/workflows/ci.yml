name: ci

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          # Версия берётся из go.mod, чтобы не разъезжаться с ней при обновлении.
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      # Сборка проходит и без собранного фронтенда: в webdist лежит .gitkeep,
      # которого достаточно для go:embed. Проверяем именно код.
      - name: go vet
        working-directory: backend
        run: go vet ./...

      - name: go test
        working-directory: backend
        run: go test ./...

      # Кросс-сборка под обе архитектуры релиза: пусть несобираемость под arm64
      # выясняется здесь, а не в момент выпуска версии.
      - name: сборка под все архитектуры
        working-directory: backend
        env:
          CGO_ENABLED: "0"
          GOOS: linux
        run: |
          for arch in amd64 arm64; do
            GOARCH=$arch go build -trimpath -o /dev/null ./cmd/netosd
          done

  # Готовый бинарник каждой сборки. Нужен, чтобы заливать изменения на тестовую
  # машину, не выпуская релиз: scripts/dev-push.sh забирает артефакт через
  # gh run download, когда локального Go нет. Собирается ровно так же, как
  # релизный, — с фронтендом внутри и без CGO.
  binary:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      # Порядок обязателен: vite кладёт файлы в backend/internal/api/webdist,
      # откуда их забирает go:embed.
      - name: сборка фронтенда
        working-directory: web
        run: |
          npm ci
          npm run build

      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - name: сборка бинарников
        working-directory: backend
        env:
          CGO_ENABLED: "0"
          GOOS: linux
        run: |
          mkdir -p ../dist
          for arch in amd64 arm64; do
            GOARCH=$arch go build \
              -trimpath \
              -ldflags "-X main.version=dev-${GITHUB_SHA::7}" \
              -o "../dist/netosd-linux-$arch" ./cmd/netosd
          done

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: netosd-linux-amd64
          path: dist/netosd-linux-amd64
          retention-days: 7

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: netosd-linux-arm64
          path: dist/netosd-linux-arm64
          retention-days: 7

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: установка зависимостей
        working-directory: web
        run: npm ci

      # npm run build сам начинается с tsc --noEmit, так что проверка типов
      # и сборка происходят одной командой.
      - name: сборка
        working-directory: web
        run: npm run build

      # Сборка фронтенда кладёт файлы в backend/internal/api/webdist. Если она
      # оставила репозиторий грязным сверх ожидаемого, значит что-то пишется не
      # туда, куда думает .gitignore.
      - name: репозиторий не загрязнён сборкой
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "сборка изменила отслеживаемые файлы:"
            git status --porcelain
            exit 1
          fi

  installer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      # Установщик запускается под root на чужой машине: синтаксическая ошибка
      # в нём дороже любой другой.
      - name: проверка install.sh
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck
          bash -n install.sh
          bash -n scripts/dev-deploy.sh
          bash -n scripts/dev-push.sh
          shellcheck --severity=warning install.sh scripts/dev-deploy.sh scripts/dev-push.sh
