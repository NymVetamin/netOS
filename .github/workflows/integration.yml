# Интеграционные тесты: они поднимают настоящий концентратор PPPoE и настоящий
# systemd-networkd, поэтому требуют root, сетевых namespace и установленных
# пакетов ppp, pppoe и ifupdown.
#
# Запускаются отдельно от ci.yml и не блокируют выпуск релиза намеренно: их
# поведение проверено на машине разработки, а не на раннере GitHub, и делать
# выпуск версии заложником непроверенного окружения неправильно. Если они
# окажутся здесь стабильными, ничто не мешает перенести их в ci.yml.
name: integration

on:
  workflow_dispatch:
  schedule:
    # Раз в неделю: этого достаточно, чтобы заметить, что обновление pppd или
    # systemd в дистрибутиве сломало наши сгенерированные конфигурации.
    - cron: "0 4 * * 1"

permissions:
  contents: read

jobs:
  integration:
    runs-on: ubuntu-latest
    # Эти тесты строят сеть из veth и правил ядра и отказываются работать в
    # пространстве имён самой машины: там они задели бы её сеть. Остальные,
    # наоборот, проверяют настоящий systemd-networkd, который живёт только в
    # пространстве имён машины, — поэтому прогон разделён на два шага. Тест,
    # требующий изоляции и не попавший в список, упадёт в первом шаге с
    # «refusing host namespace», а не будет молча пропущен.
    env:
      ISOLATED: "^(TestIntegrationAnnotationConfirmation|TestIntegrationClientPolicyPreservesRouterAccess|TestIntegrationClientRateAndCeilRepair|TestIntegrationDisabledPolicyPreservesActiveSet|TestIntegrationIPTVRulesSurviveSaveAndHealth|TestIntegrationIPv6PassthroughFilter|TestIntegrationInternetBlock|TestIntegrationL2TPGatewayDeadlineAndRetry|TestIntegrationL2TPIPsecChannel|TestIntegrationOpenConnectP12|TestIntegrationPolicyBlock|TestIntegrationWireGuardAppArmor|TestIntegrationWireGuardExitGuardRestore|TestIntegrationWireGuardPeerChannel)$"
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - name: зависимости стенда
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ppp pppoe ifupdown iproute2
          # Пакеты компонентов netOS (каталог в config/catalog.go), которые
          # нужны тестам VPN, каналов и политик: без них тесты пропускаются
          # или падают на отсутствующей утилите.
          sudo apt-get install -y -qq conntrack ipset wireguard-tools openconnect \
            ocserv openssl xl2tpd strongswan strongswan-swanctl charon-systemd \
            libstrongswan-standard-plugins libcharon-extauth-plugins libcharon-extra-plugins
          # Раннер — Ubuntu, а netOS рассчитан на Debian. Профили Ubuntu для
          # wg и swanctl разрешают только /etc/wireguard и /run/charon.vici,
          # а тесты держат конфиги и сокеты во временных каталогах. Режим
          # complain приближает раннер к Debian; совместимость с AppArmor
          # проверяется отдельно по docs/APPARMOR.md, а записи ALLOWED
          # остаются в журнале ядра.
          for profile in /etc/apparmor.d/wg /etc/apparmor.d/usr.sbin.swanctl; do
            [ -f "$profile" ] && sudo apparmor_parser -r -C "$profile"
          done
          sudo aa-status | grep -A2 -i 'complain mode' | head -20 || true

      - name: интеграционные тесты
        working-directory: backend
        run: |
          sudo --preserve-env=PATH env NETOS_INTEGRATION=1 \
            "$(command -v go)" test ./internal/subsys/... -run "PPPoE|Integration" -skip "$ISOLATED" -v

      - name: интеграционные тесты в изолированном пространстве имён
        if: ${{ !cancelled() }}
        working-directory: backend
        # Каждому тесту — своё пространство имён: тесты создают одни и те же
        # интерфейсы, монтируют /sys и заменяют таблицы iptables целиком, и в
        # общем пространстве имён параллельные пакеты мешают друг другу.
        run: |
          go=$(command -v go)
          failed=""
          for test in $(printf '%s' "$ISOLATED" | sed 's/^^(//; s/)\$$//' | tr '|' ' '); do
            dir=$(grep -rl --include='*_test.go' "^func $test(" internal | xargs -r dirname | sort -u)
            if [ "$(printf '%s\n' "$dir" | grep -c .)" != 1 ]; then
              echo "::error::$test: ожидался ровно один пакет, найдено: $dir"
              failed="$failed $test"
              continue
            fi
            sudo --preserve-env=PATH env NETOS_INTEGRATION=1 unshare --net --mount \
              "$go" test "./$dir" -run "^$test\$" -count=1 -v || failed="$failed $test"
          done
          if [ -n "$failed" ]; then
            echo "::error::упали:$failed"
            exit 1
          fi

      # Отказ «Permission denied» у root почти всегда означает LSM, а не права
      # файла. Без этого журнала причину падения на раннере не установить.
      - name: отказы AppArmor при падении
        if: ${{ failure() }}
        run: |
          . /etc/os-release && echo "ОС: $PRETTY_NAME"
          sudo aa-status 2>&1 | head -80 || true
          denials=$(sudo journalctl -k --no-pager 2>/dev/null | grep -i 'apparmor="DENIED"' || true)
          printf '%s\n' "$denials" | tail -60
          # Текст профилей, которые что-то запретили: по нему видно, какие
          # пути им разрешены.
          for profile in $(printf '%s\n' "$denials" | grep -o 'profile="[^"]*"' | cut -d'"' -f2 | sort -u); do
            # Имя сверяется с объявлением профиля, а не с любым упоминанием.
            file=$(sudo grep -lsE -- "^[[:space:]]*(profile[[:space:]]+)?$(printf '%s' "$profile" | sed 's/[][\.*^$]/\\&/g')[[:space:]]+(flags=|\{|/)" /etc/apparmor.d/* | head -1)
            [ -n "$file" ] && { echo "=== $profile: $file"; sudo cat "$file"; }
          done || true
